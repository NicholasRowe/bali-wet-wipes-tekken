<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Bali Wet Wipes Tekken. A 3D fighting game." />
  <title>Bali Wet Wipes Tekken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --p1: #4da3ff; --p2: #ff5a5a; --gold: #ffd84d; --panel: rgba(8, 10, 22, 0.78); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: 'Silkscreen', monospace; color: #fff; user-select: none; }
    canvas { display: block; }
    .layer { position: fixed; inset: 0; pointer-events: none; }
    .hidden { display: none !important; }
    .shadow { text-shadow: 3px 3px 0 #000; }

    /* ---------- Select screen ---------- */
    #select { pointer-events: auto; display: flex; flex-direction: column; justify-content: space-between; }
    .title { text-align: center; padding-top: 14px; }
    .title h1 { margin: 0; font-size: 44px; letter-spacing: 4px; color: var(--gold); text-shadow: 4px 4px 0 #b3261e, 8px 8px 0 #000; }
    .modes { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .modes button { font-family: inherit; font-size: 13px; color: #fff; background: #2a2d3a; border: 2px solid #444a5e; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
    .modes button.on { background: #b3261e; border-color: var(--gold); }
    .modes .key { color: var(--gold); }
    .sides { display: flex; justify-content: space-between; padding: 0 18px; align-items: flex-start; flex: 1; margin-top: 10px; }
    .info { width: 340px; background: var(--panel); border-radius: 10px; padding: 12px 14px; border: 2px solid rgba(255,255,255,0.1); }
    .info.p1 { border-color: var(--p1); } .info.p2 { border-color: var(--p2); }
    .info .who { font-size: 12px; opacity: 0.8; }
    .info h2 { margin: 2px 0 0; font-size: 24px; }
    .info .ttl { font-size: 12px; color: var(--gold); }
    .info .quote { font-size: 11px; opacity: 0.75; margin: 6px 0 8px; font-style: italic; }
    .stat { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; font-size: 11px; margin: 3px 0; }
    .stat .bar { height: 9px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .stat .bar div { height: 100%; background: linear-gradient(90deg, #ffd84d, #ff7a00); }
    .moves { margin-top: 8px; font-size: 11px; line-height: 1.75; }
    .moves b { color: var(--gold); display: inline-block; min-width: 54px; }
    .moves .sp { color: #ff9cf0; }
    .picks { margin-top: 6px; font-size: 12px; color: var(--gold); min-height: 16px; }
    .grid { display: flex; gap: 8px; justify-content: center; padding-bottom: 16px; }
    .card { width: 132px; background: var(--panel); border: 3px solid #333; border-radius: 8px; padding: 4px; text-align: center; position: relative; cursor: pointer; }
    .card img { width: 100%; display: block; border-radius: 4px; background: linear-gradient(#2a3a6a, #121828); image-rendering: auto; }
    .card .nm { font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card.c1 { border-color: var(--p1); box-shadow: 0 0 14px var(--p1); }
    .card.c2 { border-color: var(--p2); box-shadow: 0 0 14px var(--p2); }
    .card.c1.c2 { border-color: #c77dff; }
    .card .tagp { position: absolute; top: -10px; font-size: 11px; padding: 1px 5px; border-radius: 4px; }
    .card .tagp.t1 { left: -4px; background: var(--p1); } .card .tagp.t2 { right: -4px; background: var(--p2); }
    .card.rand img { background: linear-gradient(#5a2a6a, #1a1028); }
    .helpline { text-align: center; font-size: 11px; opacity: 0.8; padding-bottom: 6px; }
    .ready { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 54px; color: var(--gold); }

    /* ---------- Fight HUD ---------- */
    .hudtop { position: absolute; top: 14px; left: 16px; right: 16px; display: grid; grid-template-columns: 1fr 96px 1fr; gap: 10px; align-items: start; }
    .side { display: flex; flex-direction: column; gap: 4px; }
    .side.r { align-items: flex-end; }
    .nameRow { display: flex; gap: 10px; align-items: center; font-size: 18px; }
    .side.r .nameRow { flex-direction: row-reverse; }
    .portrait { width: 52px; height: 52px; border-radius: 6px; border: 3px solid #fff; background: #223; object-fit: cover; }
    .side.l .portrait { border-color: var(--p1); } .side.r .portrait { border-color: var(--p2); }
    .hp { position: relative; width: 100%; height: 24px; background: #3a0d0d; border: 3px solid #f5f5f5; border-radius: 4px; overflow: hidden; box-shadow: 0 3px 0 #000; }
    .hp .trail, .hp .fill { position: absolute; top: 0; bottom: 0; }
    .side.l .hp .trail, .side.l .hp .fill { right: 0; } .side.r .hp .trail, .side.r .hp .fill { left: 0; }
    .hp .trail { background: #fff; }
    .hp .fill { background: linear-gradient(#ffe46b, #f2a51a); transition: width 0.05s; }
    .hp .fill.low { background: linear-gradient(#ff7b6b, #d42a1a); }
    .pips { display: flex; gap: 6px; }
    .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; background: transparent; }
    .pip.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .partner { display: flex; gap: 6px; align-items: center; font-size: 11px; opacity: 0.9; }
    .side.r .partner { flex-direction: row-reverse; }
    .partner .mini { width: 120px; height: 7px; background: #3a0d0d; border: 1px solid #ccc; }
    .partner .mini div { height: 100%; background: #f2a51a; }
    .partner.ko { opacity: 0.4; text-decoration: line-through; }
    .clockBox { text-align: center; font-size: 44px; line-height: 1; padding-top: 4px; }
    .clockBox .rnd { font-size: 11px; opacity: 0.85; }
    .meterRow { position: absolute; bottom: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between; }
    .meter { width: 300px; }
    .meter .lbl { font-size: 11px; margin-bottom: 3px; }
    .meter .m { height: 12px; background: rgba(0,0,0,0.5); border: 2px solid #ddd; border-radius: 3px; overflow: hidden; }
    .meter .m div { height: 100%; background: linear-gradient(90deg, #6a3cff, #ff4fd8); }
    .meter.full .m div { background: linear-gradient(90deg, #ffd84d, #fff, #ffd84d); animation: shimmer 0.6s infinite alternate; }
    .meter.full .lbl { color: var(--gold); }
    .meter.r { text-align: right; }
    @keyframes shimmer { from { filter: brightness(1); } to { filter: brightness(1.5); } }
    .announce { position: absolute; top: 34%; left: 0; right: 0; text-align: center; }
    .announce .big { font-size: 86px; color: var(--gold); text-shadow: 5px 5px 0 #b3261e, 9px 9px 0 #000; letter-spacing: 4px; }
    .announce .sub { font-size: 22px; margin-top: 6px; text-shadow: 3px 3px 0 #000; }
    .combo { position: absolute; top: 160px; font-size: 34px; text-shadow: 3px 3px 0 #000; transition: opacity 0.3s; }
    .combo small { display: block; font-size: 13px; }
    .combo.l { left: 26px; color: #9fd0ff; } .combo.r { right: 26px; color: #ffb0b0; text-align: right; }
    .spname { position: absolute; top: 120px; font-size: 22px; padding: 6px 14px; background: linear-gradient(90deg, rgba(255,79,216,0.85), rgba(106,60,255,0.85)); border: 2px solid #fff; transition: opacity 0.3s; }
    .spname.l { left: 16px; } .spname.r { right: 16px; }
    .hint { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); font-size: 11px; opacity: 0.85; text-align: center; text-shadow: 2px 2px 0 #000; line-height: 1.6; white-space: nowrap; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .overlay .box { background: #141826; border: 3px solid var(--gold); border-radius: 10px; padding: 18px 22px; min-width: 520px; }
    .overlay h2 { margin: 0 0 10px; color: var(--gold); }
    .overlay .cols { display: flex; gap: 26px; }
    .overlay button { font-family: inherit; font-size: 14px; color: #fff; background: #2a2d3a; border: 2px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin: 10px 8px 0 0; }
    /* ---------- Intro skits ---------- */
    #cutscene { z-index: 5; }
    .cs-bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #111; padding: 9px 14px; border-radius: 14px; font-size: 15px; max-width: 320px; text-align: center; box-shadow: 4px 4px 0 #000; border: 3px solid #111; animation: pop 0.2s ease-out; }
    .cs-bubble::after { content: ''; position: absolute; left: 50%; bottom: -14px; border: 8px solid transparent; border-top-color: #111; transform: translateX(-50%); }
    .cs-caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 30px 22px; background: linear-gradient(transparent, rgba(0,0,0,0.85) 35%); text-align: center; opacity: 0; transition: opacity 0.4s; }
    .cs-caption.show { opacity: 1; }
    .cs-caption .cs-name { font-size: 40px; color: var(--gold); text-shadow: 4px 4px 0 #b3261e, 7px 7px 0 #000; }
    .cs-caption .cs-line { font-size: 20px; margin-top: 6px; text-shadow: 2px 2px 0 #000; }
    .cs-caption .cs-skip, .cs-skipper { font-size: 10px; opacity: 0.6; margin-top: 8px; }
    .cs-stamp { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-size: 96px; color: #e01e1e; border: 10px solid #e01e1e; padding: 4px 26px; border-radius: 12px; background: rgba(255,255,255,0.12); animation: stamp 0.25s ease-out; text-shadow: 3px 3px 0 #000; }
    @keyframes stamp { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); opacity: 0; } }
    .cs-popup { position: absolute; top: 18%; right: 8%; background: #fff; color: #111; padding: 16px 22px; border-radius: 12px; font-size: 18px; line-height: 1.5; text-align: center; border: 4px solid #111; box-shadow: 6px 6px 0 #000; animation: pop 0.25s ease-out; font-family: Arial, sans-serif; }
    .cs-popup b { font-size: 30px; } .cs-card { border-color: #1f9a4a; } .cs-ticket { border-color: #2a7bff; background: #f3f8ff; }
    .cs-phone { position: absolute; top: 12%; right: 9%; width: 280px; height: 470px; background: #111; border-radius: 34px; padding: 12px; box-shadow: 8px 8px 0 #000; animation: pop 0.25s ease-out; }
    .cs-ph-top { background: #00b14f; color: #fff; font: bold 20px Arial, sans-serif; padding: 12px; border-radius: 24px 24px 0 0; text-align: center; }
    .cs-ph-body { background: #f2f4f5; height: 400px; border-radius: 0 0 24px 24px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .cs-msg { font: 14px Arial, sans-serif; padding: 8px 11px; border-radius: 12px; max-width: 85%; color: #111; animation: pop 0.2s ease-out; }
    .cs-msg.bot { background: #fff; align-self: flex-start; border: 1px solid #ddd; }
    .cs-msg.me { background: #00b14f; color: #fff; align-self: flex-end; font-weight: bold; }
    .cs-msg.sys { background: #ffe9a8; align-self: center; font-weight: bold; }
    /* ---------- Touch controls ---------- */
    #touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 6; }
    #touch button { position: absolute; pointer-events: auto; font-family: inherit; color: #fff; background: rgba(20,24,40,0.55); border: 2px solid rgba(255,255,255,0.45); border-radius: 50%; touch-action: none; -webkit-user-select: none; user-select: none; }
    #touch button.down { background: rgba(255,216,77,0.6); }
    #touch .pad button { width: 58px; height: 58px; font-size: 20px; }
    #touch .t-up { left: 70px; bottom: 132px; } #touch .t-down { left: 70px; bottom: 16px; }
    #touch .t-left { left: 10px; bottom: 74px; } #touch .t-right { left: 130px; bottom: 74px; }
    #touch .acts button { width: 70px; height: 70px; font-size: 12px; line-height: 1.1; }
    #touch .acts small { display: block; font-size: 9px; opacity: 0.8; }
    #touch .t-q { right: 92px; bottom: 20px; } #touch .t-e { right: 14px; bottom: 70px; }
    #touch .t-sp { right: 92px; bottom: 100px; background: rgba(160,60,255,0.55); } #touch .t-tag { right: 14px; bottom: 150px; width: 54px !important; height: 54px !important; }
    #touch .t-pause { right: 14px !important; top: -100vh; margin-top: 90px; width: 44px !important; height: 44px !important; bottom: auto !important; }
    @media (max-width: 900px), (max-height: 500px) {
      .title h1 { font-size: 22px; letter-spacing: 1px; }
      .modes button { font-size: 10px; padding: 5px 7px; }
      .sides { padding: 0 8px; margin-top: 4px; }
      #select { overflow: hidden; }
      .info { width: 30vw; padding: 6px 8px; font-size: 10px; }
      .info .moves, .info .quote, .info .who { display: none; }
      .info h2 { font-size: 15px; } .info .quote { font-size: 9px; margin: 3px 0; } .moves { font-size: 9px; line-height: 1.5; } .stat { font-size: 9px; grid-template-columns: 52px 1fr; margin: 1px 0; }
      .card { width: 13vw; max-width: 96px; padding: 2px; } .card .nm { font-size: 8px; }
      .grid { gap: 4px; padding-bottom: 8px; } .helpline { font-size: 8px; }
      .hudtop { top: 6px; left: 8px; right: 8px; grid-template-columns: 1fr 64px 1fr; }
      .nameRow { font-size: 11px; } .portrait { width: 34px; height: 34px; } .hp { height: 14px; border-width: 2px; }
      .clockBox { font-size: 26px; } .partner .mini { width: 70px; }
      .meterRow { bottom: auto; top: 86px; left: 8px; right: 8px; } .meter { width: 34vw; } .meter .lbl { font-size: 8px; }
      .announce .big { font-size: 44px; } .announce .sub { font-size: 13px; }
      .combo { font-size: 20px; top: 120px; } .spname { font-size: 12px; top: 100px; }
      .hint { display: none; }
      .cs-caption .cs-name { font-size: 24px; } .cs-caption .cs-line { font-size: 13px; }
      .cs-bubble { font-size: 11px; max-width: 220px; } .cs-stamp { font-size: 48px; border-width: 6px; }
      .cs-phone { width: 190px; height: 300px; top: 6%; right: 4%; } .cs-ph-body { height: 245px; } .cs-msg { font-size: 11px; }
      .cs-popup { font-size: 12px; padding: 10px 14px; } .cs-popup b { font-size: 20px; }
      .overlay .box { min-width: 0; width: 92vw; padding: 12px; } .overlay .cols { gap: 10px; font-size: 9px; }
    }
    .back { position: absolute; top: 12px; left: 14px; font-size: 11px; color: #fff; opacity: 0.7; pointer-events: auto; text-decoration: none; }
  </style>
  <script type="module" crossorigin src="./assets/main-emLscc4t.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/model-ih32FQ3S.js">
</head>
<body>
  <!-- Character select -->
  <div id="select" class="layer">
    <div class="title">
      <h1>BALI WET WIPES TEKKEN</h1>
      <div class="modes" id="modes"></div>
    </div>
    <div class="sides">
      <div class="info p1" id="info0"></div>
      <div class="info p2" id="info1"></div>
    </div>
    <div>
      <div class="helpline" id="selHelp"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="ready shadow hidden" id="ready">GET READY!</div>
  </div>

  <!-- Fight HUD -->
  <div id="hud" class="layer hidden">
    <div class="hudtop">
      <div class="side l" id="side0"></div>
      <div class="clockBox shadow"><div id="clock">60</div><div class="rnd" id="rnd">ROUND 1</div></div>
      <div class="side r" id="side1"></div>
    </div>
    <div class="combo l" id="combo0"></div>
    <div class="combo r" id="combo1"></div>
    <div class="spname l" id="sp0" style="opacity:0"></div>
    <div class="spname r" id="sp1" style="opacity:0"></div>
    <div class="announce" id="announce"><div class="big" id="annBig"></div><div class="sub" id="annSub"></div></div>
    <div class="hint" id="hint"></div>
    <div class="meterRow">
      <div class="meter l" id="meter0"><div class="lbl">SPECIAL</div><div class="m"><div></div></div></div>
      <div class="meter r" id="meter1"><div class="lbl">SPECIAL</div><div class="m"><div style="margin-left:auto"></div></div></div>
    </div>
  </div>

  <div id="pause" class="overlay hidden"><div class="box">
    <h2>PAUSED</h2>
    <div class="cols" id="moveLists"></div>
    <button id="btnResume">Resume (Esc)</button><button id="btnSelect">Character select</button><button id="btnMute">Sound: on</button>
  </div></div>

  <div id="touch" class="hidden">
    <div class="pad">
      <button data-k="KeyW" class="t-up">▲</button>
      <button data-k="KeyA" class="t-left">◀</button>
      <button data-k="KeyS" class="t-down">▼</button>
      <button data-k="KeyD" class="t-right">▶</button>
    </div>
    <div class="acts">
      <button data-k="KeyF" class="t-tag">TAG</button>
      <button data-k="KeyQ" class="t-q">PUNCH<small>Q</small></button>
      <button data-k="KeyE" class="t-e">KICK<small>E</small></button>
      <button data-k="KeyQ+KeyE" class="t-sp">★<small>SPECIAL</small></button>
      <button data-k="Escape" class="t-pause">II</button>
    </div>
  </div>
</body>
</html>
